<!-- topbar.component.html -->
<header class="topbar" [class.topbar--collapsed]="sidebarCollapsed">

  <!-- Hamburger -->
  <button class="topbar__menu-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <!-- Page title -->
  <h1 *ngIf="title" class="topbar__title">{{ title }}</h1>

  <div class="topbar__spacer"></div>

  <!-- User info -->
  <ng-container *ngIf="authState.user$ | async as user">
    <div class="topbar__user">
      <div class="topbar__avatar">{{ getInitials(user.name) }}</div>
      <div class="topbar__user-info">
        <p class="topbar__user-name">{{ user.name }}</p>
        <p class="topbar__user-role">{{ user.role }}</p>
      </div>
    </div>
  </ng-container>

</header>
