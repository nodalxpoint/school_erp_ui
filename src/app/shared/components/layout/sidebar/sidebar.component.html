<div *ngIf="sidebarOpen"
     class="sidebar-overlay"
     (click)="closeSidebar()">
</div>

<aside class="sidebar"
       [class.sidebar--collapsed]="sidebarCollapsed"
       [class.sidebar--open]="sidebarOpen">

  <div class="sidebar__logo" [class.sidebar__logo--collapsed]="sidebarCollapsed">
    <div class="sidebar__logo-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
    </div>
    <div *ngIf="!sidebarCollapsed" class="sidebar__logo-text">
      <span class="sidebar__logo-name">SchoolERP</span>
      <span class="sidebar__logo-tagline">Management System</span>
    </div>
    <button *ngIf="!sidebarCollapsed" class="sidebar__close-btn" (click)="closeSidebar()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar__nav">
    <p class="sidebar__nav-section-label" [class.sidebar__nav-section-label--collapsed]="sidebarCollapsed">
      {{ sidebarCollapsed ? '·' : 'Main Menu' }}
    </p>

    <ul class="sidebar__nav-list">
      <li *ngFor="let item of filteredNavItems">

        <ng-container *ngIf="item.href === '/teachers'; else subjectsCheck">
          <div class="sidebar__nav-item sidebar__nav-item--dropdown"
               [class.sidebar__nav-item--active]="isTeachersActive()"
               [class.sidebar__nav-item--collapsed]="sidebarCollapsed"
               [title]="sidebarCollapsed ? item.label : ''"
               (click)="toggleTeachersDropdown()">
            <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87"/>
              <path d="M16 3.13a4 4 0 010 7.75"/>
            </svg>
            <span *ngIf="!sidebarCollapsed" class="sidebar__nav-label-text">{{ item.label }}</span>
            <svg *ngIf="!sidebarCollapsed"
                 class="sidebar__dropdown-chevron"
                 [class.sidebar__dropdown-chevron--open]="teachersDropdownOpen"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </div>

          <ul *ngIf="teachersDropdownOpen && !sidebarCollapsed" class="sidebar__dropdown-list">
            <li>
              <a routerLink="/teachers" class="sidebar__dropdown-item" [class.sidebar__dropdown-item--active]="isExactActive('/teachers')" (click)="closeSidebar()">
                <span class="sidebar__dropdown-dot"></span>All Teachers
              </a>
            </li>
            <li>
              <a routerLink="/subjects/assign-teacher" class="sidebar__dropdown-item" [class.sidebar__dropdown-item--active]="isExactActive('/subjects/assign-teacher')" (click)="closeSidebar()">
                <span class="sidebar__dropdown-dot"></span>Assign Subject Teacher
              </a>
            </li>
            <li>
              <a routerLink="/teachers/class-teacher" class="sidebar__dropdown-item" [class.sidebar__dropdown-item--active]="isExactActive('/teachers/class-teacher')" (click)="closeSidebar()">
                <span class="sidebar__dropdown-dot"></span> Assign Class Teacher
              </a>
            </li>
          </ul>
        </ng-container>

        <ng-template #subjectsCheck>
          <ng-container *ngIf="item.href === '/subjects'; else regularItem">
            <div class="sidebar__nav-item sidebar__nav-item--dropdown"
                 [class.sidebar__nav-item--active]="isSubjectsActive()"
                 [class.sidebar__nav-item--collapsed]="sidebarCollapsed"
                 [title]="sidebarCollapsed ? item.label : ''"
                 (click)="toggleSubjectsDropdown()">
              <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>
              <span *ngIf="!sidebarCollapsed" class="sidebar__nav-label-text">{{ item.label }}</span>
              <svg *ngIf="!sidebarCollapsed"
                   class="sidebar__dropdown-chevron"
                   [class.sidebar__dropdown-chevron--open]="subjectsDropdownOpen"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>

            <ul *ngIf="subjectsDropdownOpen && !sidebarCollapsed" class="sidebar__dropdown-list">
              <li>
                <a routerLink="/subjects/manage" class="sidebar__dropdown-item" [class.sidebar__dropdown-item--active]="isExactActive('/subjects/manage')" (click)="closeSidebar()">
                  <span class="sidebar__dropdown-dot"></span>Subject Management
                </a>
              </li>
            </ul>
          </ng-container>
        </ng-template>

        <ng-template #regularItem>
          <a [routerLink]="item.href"
             class="sidebar__nav-item"
             [class.sidebar__nav-item--active]="isActive(item.href)"
             [class.sidebar__nav-item--collapsed]="sidebarCollapsed"
             [title]="sidebarCollapsed ? item.label : ''"
             (click)="closeSidebar()">
            <svg class="sidebar__nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ng-container [ngSwitch]="item.icon">
                <ng-container *ngSwitchCase="'layout-dashboard'">
                  <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                  <polyline points="9 22 9 12 15 12 15 22"/>
                </ng-container>
                <ng-container *ngSwitchCase="'graduation-cap'">
                  <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                  <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                </ng-container>
                <ng-container *ngSwitchCase="'calendar-check'">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <path d="M9 16l2 2 4-4"/>
                </ng-container>
                <ng-container *ngSwitchCase="'credit-card'">
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                  <line x1="1" y1="10" x2="23" y2="10"/>
                </ng-container>
                <ng-container *ngSwitchCase="'bar-chart-3'">
                  <line x1="18" y1="20" x2="18" y2="10"/>
                  <line x1="12" y1="20" x2="12" y2="4"/>
                  <line x1="6" y1="20" x2="6" y2="14"/>
                </ng-container>
                <ng-container *ngSwitchCase="'book-open'">
                  <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
                  <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
                </ng-container>
                <ng-container *ngSwitchCase="'settings'">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                </ng-container>
              </ng-container>
            </svg>
            <span *ngIf="!sidebarCollapsed" class="sidebar__nav-label-text">{{ item.label }}</span>
          </a>
        </ng-template>

      </li>
    </ul>
  </nav>

  <div class="sidebar__footer" [class.sidebar__footer--collapsed]="sidebarCollapsed">
    <ng-container *ngIf="authState.user$ | async as user">
      <div class="sidebar__user" [class.sidebar__user--collapsed]="sidebarCollapsed">
        <div class="sidebar__avatar">{{ getInitials(user.name) }}</div>
        <div *ngIf="!sidebarCollapsed" class="sidebar__user-info">
          <p class="sidebar__user-name">{{ user.name }}</p>
          <p class="sidebar__user-role">{{ user.role }}</p>
        </div>
        <button *ngIf="!sidebarCollapsed" class="sidebar__logout-btn" (click)="logout()" title="Logout">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </ng-container>
  </div>

  <button class="sidebar__collapse-btn" (click)="toggleCollapsed()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         [style.transform]="sidebarCollapsed ? 'rotate(180deg)' : ''">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>
</aside>
