<div class="page-container">
  <div class="page-header">
    <h2 class="page-title">{{ isEditMode ? 'Edit User' : 'Create User' }}</h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input formControlName="adminFirstName" placeholder="First Name">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input formControlName="adminLastName" placeholder="Last Name">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Email</label>
        <input formControlName="adminEmail" placeholder="Email">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input formControlName="adminPhone" placeholder="Phone">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Password {{ isEditMode ? '(leave blank to keep unchanged)' : '' }}</label>
        <input type="password" formControlName="adminPassword" placeholder="Password">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="ACCOUNTANT">ACCOUNTANT</option>
          <option value="SCHOOL_ADMIN">SCHOOL_ADMIN</option>
        </select>
      </div>
    </div>

    <div class="form-row" *ngIf="isEditMode">
      <div class="form-group">
        <label>Pass Key <span *ngIf="loadingUser" style="color:#718096; font-size:11px;">(fetching latest...)</span></label>
        <input [value]="loadingUser ? 'Loading...' : (passKey || 'Not generated yet')" readonly
               placeholder="Generated upon registration"
               style="background-color: #f7fafc; cursor: not-allowed; font-weight: 700; letter-spacing: 0.1em; font-family: monospace;">
      </div>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-outline" (click)="cancel()" [disabled]="saving || regenerating">Cancel</button>
      <button type="button" class="btn-outline" *ngIf="isEditMode" [disabled]="saving || regenerating" (click)="onRegeneratePasskey()">
        {{ regenerating ? 'Regenerating...' : 'Regenerate Passkey' }}
      </button>
      <button type="submit" class="btn-primary" [disabled]="saving || regenerating">
        {{ saving ? 'Saving...' : 'Save User' }}
      </button>
    </div>
  </form>
</div>
