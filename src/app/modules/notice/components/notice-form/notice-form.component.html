<div class="form-page">

  <div class="custom-toast" *ngIf="toast" [ngClass]="'custom-toast--' + toast.type">
    <div class="toast-icon-wrap">
      <svg *ngIf="toast.type === 'success'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <svg *ngIf="toast.type === 'error'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </div>
    <span class="toast-message-text">{{ toast.message }}</span>
  </div>

  <div class="form-header">
    <button class="btn-back" (click)="goBack()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to Notice Board
    </button>
    <h2>{{ isEditMode ? 'Edit Notice' : 'Publish New Notice' }}</h2>
  </div>

  <div class="form-card">
    <div class="form-body">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" [(ngModel)]="formTitle" placeholder="e.g. Independence Day Celebration" />
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea [(ngModel)]="formDescription" rows="5" placeholder="Notice details..."></textarea>
      </div>

      <!-- Teacher: auto-locked to own class, no dropdown -->
      <div class="form-group" *ngIf="isTeacher">
        <label>Target Class</label>
        <div class="locked-field">{{ isLoadingTeacherClass ? 'Loading your class...' : (teacherClassName || 'Not assigned') }}</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Publish Date *</label>
          <input type="date" [(ngModel)]="formPublishDate" />
        </div>
        <div class="form-group">
          <label>Expiry Date *</label>
          <input type="date" [(ngModel)]="formExpiryDate" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn-cancel" (click)="goBack()" [disabled]="isSaving">Cancel</button>
      <button class="btn-save" (click)="submitNotice()" [disabled]="isSaving || !isFormValid">
        {{ isSaving ? 'Saving...' : (isEditMode ? 'Update Notice' : 'Publish Notice') }}
      </button>
    </div>
  </div>

</div>
