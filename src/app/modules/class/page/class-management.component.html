<div class="page-wrapper">

  <!-- Toast -->
  <div class="toast" *ngIf="toast"
       [class.toast-success]="toast.type === 'success'"
       [class.toast-error]="toast.type === 'error'">
    <svg *ngIf="toast.type === 'success'" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <svg *ngIf="toast.type === 'error'" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
    {{ toast.message }}
  </div>

  <!-- Delete confirm modal -->
  <div class="modal-backdrop" *ngIf="deleteTargetId">
    <div class="confirm-modal">
      <div class="confirm-icon">🗑️</div>
      <h3 class="confirm-title">Delete Class?</h3>
      <p class="confirm-text">This action cannot be undone. All associated data will be removed.</p>
      <div class="confirm-actions">
        <button class="btn-secondary" (click)="cancelDelete()">Cancel</button>
        <button class="btn-danger" (click)="doDelete()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Page header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Classes &amp; Sections</h1>
      <p class="page-sub">{{ filteredCount }} {{ filteredCount === 1 ? 'class' : 'classes' }} in this school</p>
    </div>
    <div class="header-actions">
      <button class="btn-bulk-delete" *ngIf="selectedIds.size > 0" (click)="bulkDelete()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
        </svg>
        Delete ({{ selectedIds.size }})
      </button>
      <button class="btn-primary" (click)="onAdd()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Class
      </button>
    </div>
  </div>

  <!-- Class List -->
  <app-class-list
    [classes]="classes"
    [isLoading]="isLoading"
    [selectedIds]="selectedIds"
    (editClass)="onEdit($event)"
    (deleteClass)="confirmDelete($event)"
    (toggleSelect)="toggleSelect($event)"
    (toggleSelectAll)="toggleSelectAll($event)"
  ></app-class-list>

</div>
