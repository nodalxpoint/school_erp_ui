<div class="list-container">

  <!-- Loading skeleton -->
  <ng-container *ngIf="isLoading">
    <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]">
      <div class="skeleton w-5"></div>
      <div class="skeleton w-48"></div>
      <div class="skeleton w-24"></div>
    </div>
  </ng-container>

  <!-- Empty state -->
  <div class="empty-state" *ngIf="!isLoading && classes.length === 0">
    <div class="empty-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12h8M8 8h8M8 16h5"/>
      </svg>
    </div>
    <p class="empty-title">No classes yet</p>
    <p class="empty-sub">Create a class or use bulk import to get started.</p>
  </div>

  <!-- Table -->
  <table class="class-table" *ngIf="!isLoading && classes.length > 0">
    <thead>
      <tr>
        <th class="col-check">
          <label class="checkbox-wrap">
            <input
              type="checkbox"
              [checked]="allSelected"
              [indeterminate]="someSelected"
              (change)="toggleSelectAll.emit($any($event.target).checked)"
            />
            <span class="custom-check"></span>
          </label>
        </th>
        <th class="col-name">Class Name</th>
        <th class="col-id">Class ID</th>
        <th class="col-actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let cls of classes; trackBy: trackById"
        [class.selected]="selectedIds.has(cls.id)"
        class="table-row"
      >
        <td class="col-check">
          <label class="checkbox-wrap">
            <input
              type="checkbox"
              [checked]="selectedIds.has(cls.id)"
              (change)="toggleSelect.emit(cls.id)"
            />
            <span class="custom-check"></span>
          </label>
        </td>
        <td class="col-name">
          <div class="class-name-cell">
            <span class="class-badge">{{ cls.className[0] }}</span>
            <span class="class-name">{{ cls.className }}</span>
          </div>
        </td>
        <td class="col-id">
          <code class="id-chip">{{ cls.id.substring(0, 8) }}…</code>
        </td>
        <td class="col-actions">
          <div class="action-btns">
            <button class="action-btn edit-btn" (click)="editClass.emit(cls)" title="Edit">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
            <button class="action-btn delete-btn" (click)="deleteClass.emit(cls.id)" title="Delete">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                <path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
