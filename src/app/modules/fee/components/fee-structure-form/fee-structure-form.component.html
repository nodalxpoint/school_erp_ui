<div class="school-erp-container">

  <div class="app-header">
    <div class="page-title-node">
      <span>{{ isEditMode ? 'Edit Fee Structure' : 'Add Fee Structure' }}</span>
    </div>
    <button class="btn-action-secondary" (click)="onCancel()">
      ← Back to List
    </button>
  </div>

  <div class="main-dashboard-layout single-panel-focus">
    <div class="form-wrapper-block">
      <div class="modal-form-grid">

        <!-- Class -->
        <div class="form-field">
          <label>Class <span class="required-star">*</span></label>
          <select class="modal-input" [(ngModel)]="formData.classId">
            <option value="">Select Class</option>
            <option *ngFor="let c of classes" [value]="c.id">{{ c.label }}</option>
          </select>
        </div>

        <!-- Fee Name -->
        <div class="form-field">
          <label>Fee Name <span class="required-star">*</span></label>
          <input type="text" class="modal-input" [(ngModel)]="formData.feeName"
                 placeholder="e.g. Monthly Tuition Fee">
        </div>

        <!-- Amount & Frequency -->
        <div class="form-field-row-split">
          <div class="form-field">
            <label>Amount (₹) <span class="required-star">*</span></label>
            <input type="number" class="modal-input" [(ngModel)]="formData.amount"
                   placeholder="0.00" min="1">
          </div>
          <div class="form-field">
            <label>Frequency <span class="required-star">*</span></label>
            <select class="modal-input" [(ngModel)]="formData.frequency">
              <option value="MONTHLY">Monthly</option>
              <option value="QUARTERLY">Quarterly</option>
              <option value="ANNUALLY">Annually</option>
              <option value="ONE_TIME">One Time</option>
            </select>
          </div>
        </div>

        <!-- Due Date ✅ added -->
<div class="form-field">
  <label>Due Date <span class="optional-tag">(optional)</span></label>
  <input type="date" class="modal-input" [(ngModel)]="formData.dueDate">
</div>

        <!-- Summary preview -->
        <div class="preview-box" *ngIf="formData.feeName && formData.amount > 0">
          <div class="preview-row">
            <span class="preview-label">Summary</span>
          </div>
          <div class="preview-content">
            <strong>{{ formData.feeName }}</strong> — ₹{{ formData.amount | number:'1.2-2' }}
            <span class="freq-chip">{{ formData.frequency }}</span>
            <span class="due-chip" *ngIf="formData.dueDate">Due: {{ formData.dueDate | date:'mediumDate' }}</span>
 
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions-footer-row">
          <button class="btn-secondary-link" (click)="onCancel()" [disabled]="isLoading">Cancel</button>
          <button class="btn-action-primary" (click)="onSaveSubmit()" [disabled]="isLoading">
            <span *ngIf="!isLoading">{{ isEditMode ? 'Update Structure' : 'Save Structure' }}</span>
            <span *ngIf="isLoading">Saving...</span>
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Toast (validation/API errors ke liye) -->
  <div class="app-toast" [class.toast-visible]="showToast" [class.toast-error]="toastType === 'error'">
    <div class="toast-icon">
      <svg *ngIf="toastType === 'success'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#38A169"/>
        <path d="M7 12.5L10.2 15.7L17 8.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <svg *ngIf="toastType === 'error'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#E53E3E"/>
        <path d="M12 7V13" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="16.5" r="1.2" fill="white"/>
      </svg>
    </div>
    <div class="toast-text">
      <span class="toast-title">{{ toastType === 'success' ? 'Success' : 'Error' }}</span>
      <span class="toast-msg">{{ toastMessage }}</span>
    </div>
  </div>

</div>
