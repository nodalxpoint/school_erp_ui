<!-- teacher-list.component.html -->

<div class="list-wrapper" [class.has-detail]="selectedTeacher">

  <!-- ─── Left: Table pane ─── -->
  <div class="table-pane">

    <!-- Search bar -->
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" [(ngModel)]="searchText"
               placeholder="Search by name…" (keyup.enter)="onSearch()" />
        <button class="search-clear" *ngIf="searchText"
                (click)="searchText = ''; onSearch()">×</button>
      </div>
      <button class="btn-search" (click)="onSearch()">Search</button>
      <button class="btn-add" (click)="onAddTeacher()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Add Teacher
  </button>
    </div>

    <!-- Skeleton -->
    <ng-container *ngIf="isLoading">
      <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]">
        <div class="sk-avatar"></div>
        <div class="sk-lines">
          <div class="sk sk-name"></div>
          <div class="sk sk-meta"></div>
        </div>
        <div class="sk sk-code"></div>
        <div class="sk sk-qual"></div>
        <div class="sk sk-date"></div>
        <div class="sk sk-btn"></div>
      </div>
    </ng-container>

    <!-- Empty -->
    <div class="empty-state" *ngIf="!isLoading && safeTeachers.length === 0">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <p class="empty-title">No teachers found</p>
      <p class="empty-sub">Add a teacher using the Add Teacher link.</p>
    </div>

    <!-- Table -->
    <table class="teacher-table" *ngIf="!isLoading && safeTeachers.length > 0">
      <thead>
        <tr>
          <th class="col-teacher">Teacher</th>
          <th class="col-code">Emp. Code</th>
          <th class="col-qual">Qualification</th>
          <th class="col-date">Joining Date</th>
          <th class="col-actions"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of safeTeachers; trackBy: trackById"
            class="table-row"
            [class.row--selected]="selectedTeacher?.teacherId === t.teacherId">
          <td class="col-teacher">
            <div class="teacher-cell">
              <div class="avatar">{{ initials(t) }}</div>
              <div class="teacher-info">
                <span class="teacher-name">{{ teacherName(t) }}</span>
                <span class="teacher-email">{{ t.email }}</span>
              </div>
            </div>
          </td>
          <td class="col-code">
            <code class="code-chip" *ngIf="t.employeeCode">{{ t.employeeCode }}</code>
            <span class="muted" *ngIf="!t.employeeCode">—</span>
          </td>
          <td class="col-qual">
            <span class="qual-tag" *ngIf="t.qualification">{{ t.qualification }}</span>
            <span class="muted" *ngIf="!t.qualification">—</span>
          </td>
          <td class="col-date">
            <span *ngIf="t.joiningDate">{{ t.joiningDate | date:'dd MMM yyyy' }}</span>
            <span class="muted" *ngIf="!t.joiningDate">—</span>
          </td>
          <td class="col-actions">
            <!-- View button -->
            <button class="view-btn"
                  [class.view-btn--active]="selectedTeacher?.teacherId === t.teacherId"
                    (click)="onView(t)" title="View details">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              View
            </button>
            <!-- Edit button -->
            <button class="edit-btn" (click)="onEdit(t)" title="Edit">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" *ngIf="totalPages > 1">
      <button class="pg-btn" [disabled]="currentPage === 0"
              (click)="onPageChange(currentPage - 1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button *ngFor="let p of pages" class="pg-btn"
              [class.active]="p === currentPage"
              (click)="onPageChange(p)">{{ p + 1 }}</button>
      <button class="pg-btn" [disabled]="currentPage === totalPages - 1"
              (click)="onPageChange(currentPage + 1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

  </div><!-- /table-pane -->

  <!-- ─── Right: Detail panel ─── -->
  <div class="detail-pane" *ngIf="selectedTeacher">
    <app-teacher-detail
      [teacher]="selectedTeacher"
      (edit)="onDetailEdit($event)"
      (close)="onDetailClose()"
    ></app-teacher-detail>
  </div>

</div><!-- /list-wrapper -->
