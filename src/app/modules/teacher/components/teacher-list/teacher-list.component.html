<div class="list-container">

  <!-- Skeleton -->
  <ng-container *ngIf="isLoading">
    <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]">
      <div class="sk-avatar"></div>
      <div class="sk-lines">
        <div class="sk sk-name"></div>
        <div class="sk sk-meta"></div>
      </div>
      <div class="sk sk-code"></div>
      <div class="sk sk-qual"></div>
      <div class="sk sk-date"></div>
      <div class="sk sk-btn"></div>
    </div>
  </ng-container>

  <!-- Empty -->
  <div class="empty-state" *ngIf="!isLoading && safeTeachers.length === 0">
    <div class="empty-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <p class="empty-title">No teachers found</p>
    <p class="empty-sub">Add a teacher using the form above.</p>
  </div>

  <!-- Table -->
  <table class="teacher-table" *ngIf="!isLoading && safeTeachers.length > 0">
    <thead>
      <tr>
        <th class="col-teacher">Teacher</th>
        <th class="col-code">Emp. Code</th>
        <th class="col-qual">Qualification</th>
        <th class="col-date">Joining Date</th>
        <th class="col-actions"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let t of safeTeachers; trackBy: trackById" class="table-row">
        <td class="col-teacher">
          <div class="teacher-cell">
            <div class="avatar">{{ initials(t) }}</div>
            <div class="teacher-info">
              <span class="teacher-name">{{ teacherName(t) }}</span>
              <span class="teacher-email">{{ t.email }}</span>
            </div>
          </div>
        </td>
        <td class="col-code">
          <code class="code-chip" *ngIf="t.employeeCode">{{ t.employeeCode }}</code>
          <span class="muted" *ngIf="!t.employeeCode">—</span>
        </td>
        <td class="col-qual">
          <span class="qual-tag" *ngIf="t.qualification">{{ t.qualification }}</span>
          <span class="muted" *ngIf="!t.qualification">—</span>
        </td>
        <td class="col-date">
          <span *ngIf="t.joiningDate">{{ t.joiningDate | date:'dd MMM yyyy' }}</span>
          <span class="muted" *ngIf="!t.joiningDate">—</span>
        </td>
        <td class="col-actions">
          <button class="edit-btn" (click)="editTeacher.emit(t)" title="Edit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edit
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Pagination -->
  <div class="pagination" *ngIf="totalPages > 1">
    <button class="pg-btn" [disabled]="currentPage === 0" (click)="pageChange.emit(currentPage - 1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button
      *ngFor="let p of pages"
      class="pg-btn"
      [class.active]="p === currentPage"
      (click)="pageChange.emit(p)"
    >{{ p + 1 }}</button>
    <button class="pg-btn" [disabled]="currentPage === totalPages - 1" (click)="pageChange.emit(currentPage + 1)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>

</div>
