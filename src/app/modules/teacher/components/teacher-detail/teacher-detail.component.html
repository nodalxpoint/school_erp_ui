<div class="detail-panel" *ngIf="teacher">
  <div class="panel-header">
    <h3 class="panel-title">Teacher Details</h3>
    <button class="close-btn" (click)="close.emit()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="panel-body">
    <!-- Avatar + name -->
    <div class="profile-row">
      <div class="big-avatar">{{ initials }}</div>
      <div>
        <p class="profile-name">{{ fullName }}</p>
        <p class="profile-email">{{ teacher.email }}</p>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <span class="info-label">Employee Code</span>
        <span class="info-value">
          <code class="code-chip" *ngIf="teacher.employeeCode">{{ teacher.employeeCode }}</code>
          <span class="na" *ngIf="!teacher.employeeCode">Not set</span>
        </span>
      </div>
      <div class="info-item">
        <span class="info-label">Qualification</span>
        <span class="info-value">{{ teacher.qualification || 'Not set' }}</span>
      </div>
      <div class="info-item">
        <span class="info-label">Joining Date</span>
        <span class="info-value">
          {{ teacher.joiningDate ? (teacher.joiningDate | date:'dd MMMM yyyy') : 'Not set' }}
        </span>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <button class="btn-edit" (click)="edit.emit(teacher)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      Edit Teacher
    </button>
  </div>
</div>
