<div class="assign-wrap">

  <!-- ── Assignment Form ── -->
  <div class="assign-card">
    <div class="card-header">
      <div class="card-header-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      <div>
        <h3 class="card-title">Assign Class Teacher</h3>
        <p class="card-sub">Assign or reassign a teacher to a class-section for an academic session.</p>
      </div>
    </div>

    <div class="card-body">
      <div class="field-grid">

        <!-- Class -->
        <div class="field-group" [class.has-error]="errors['classId']">
          <label class="field-label">Class <span class="req">*</span></label>
          <select class="field-select"
                  [(ngModel)]="form.classId"
                  (ngModelChange)="onClassChange()"
                  [disabled]="isSubmitting">
            <option value="">Select class</option>
            <option *ngFor="let c of classes" [value]="c.id">{{ c.name }}</option>
          </select>
          <span class="err" *ngIf="errors['classId']">{{ errors['classId'] }}</span>
        </div>

        <!-- Section -->
        <div class="field-group" [class.has-error]="errors['sectionId']">
          <label class="field-label">Section <span class="req">*</span></label>
          <select class="field-select"
                  [(ngModel)]="form.sectionId"
                  [disabled]="isSubmitting">
            <option value="">Select section</option>
            <option *ngFor="let s of filteredSections" [value]="s.id">{{ s.name }}</option>
          </select>
          <span class="err" *ngIf="errors['sectionId']">{{ errors['sectionId'] }}</span>
        </div>

        <!-- Teacher -->
        <div class="field-group" [class.has-error]="errors['teacherId']">
          <label class="field-label">Teacher <span class="req">*</span></label>
          <select class="field-select"
                  [(ngModel)]="form.teacherId"
                  [disabled]="isSubmitting">
            <option value="">Select teacher</option>
            <option *ngFor="let t of teachers" [value]="t.id">{{ teacherName(t) }}</option>
          </select>
          <span class="err" *ngIf="errors['teacherId']">{{ errors['teacherId'] }}</span>
        </div>

        <!-- Academic Session -->
        <div class="field-group" [class.has-error]="errors['academicSessionId']">
          <label class="field-label">Academic Session <span class="req">*</span></label>
          <select class="field-select"
                  [(ngModel)]="form.academicSessionId"
                  [disabled]="isSubmitting">
            <option value="">Select session</option>
            <option *ngFor="let a of academicSessions" [value]="a.id">{{ a.name }}</option>
          </select>
          <span class="err" *ngIf="errors['academicSessionId']">{{ errors['academicSessionId'] }}</span>
        </div>

      </div>
    </div>

    <div class="card-footer">
      <button class="btn-reset" type="button" (click)="resetForm()" [disabled]="isSubmitting">Reset</button>
      <button class="btn-assign" type="button" (click)="onSubmit()" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner"></span>
        <svg *ngIf="!isSubmitting" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        {{ isSubmitting ? 'Assigning…' : 'Assign Teacher' }}
      </button>
    </div>
  </div>

</div>
