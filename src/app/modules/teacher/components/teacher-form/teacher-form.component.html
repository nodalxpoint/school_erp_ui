<div class="form-card">
  <div class="form-header">
    <div class="form-header-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>
    <h3 class="form-title">{{ isEditMode ? 'Edit Teacher' : 'Add New Teacher' }}</h3>
  </div>

  <div class="form-body">
    <!-- Row: First + Last name -->
    <div class="field-row">
      <div class="field-group" [class.has-error]="errors['firstName']">
        <label class="field-label">First Name <span class="req">*</span></label>
        <input class="field-input" type="text" [(ngModel)]="form.firstName"
               placeholder="First name" [disabled]="isSubmitting" />
        <span class="err" *ngIf="errors['firstName']">{{ errors['firstName'] }}</span>
      </div>
      <div class="field-group">
        <label class="field-label">Last Name</label>
        <input class="field-input" type="text" [(ngModel)]="form.lastName"
               placeholder="Last name" [disabled]="isSubmitting" />
      </div>
    </div>

    <!-- Email -->
    <div class="field-group" [class.has-error]="errors['email']">
      <label class="field-label">Email <span class="req">*</span></label>
      <input class="field-input" type="email" [(ngModel)]="form.email"
             placeholder="teacher@school.com" [disabled]="isSubmitting || isEditMode" />
      <span class="err" *ngIf="errors['email']">{{ errors['email'] }}</span>
    </div>

    <!-- Password (only on create) -->
    <div class="field-group" *ngIf="!isEditMode" [class.has-error]="errors['password']">
      <label class="field-label">Password <span class="req">*</span></label>
      <div class="password-wrap">
        <input class="field-input" [type]="showPassword ? 'text' : 'password'"
               [(ngModel)]="form.password" placeholder="Set password"
               [disabled]="isSubmitting" />
        <button class="toggle-pw" type="button" (click)="showPassword = !showPassword">
          <svg *ngIf="!showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg *ngIf="showPassword" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <span class="err" *ngIf="errors['password']">{{ errors['password'] }}</span>
    </div>

    <div class="divider"><span>Professional Info</span></div>

    <!-- Row: Employee code + Qualification -->
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Employee Code</label>
        <input class="field-input" type="text" [(ngModel)]="form.employeeCode"
               placeholder="EMP-001" [disabled]="isSubmitting" />
      </div>
      <div class="field-group">
        <label class="field-label">Qualification</label>
        <input class="field-input" type="text" [(ngModel)]="form.qualification"
               placeholder="B.Ed, M.Sc etc." [disabled]="isSubmitting" />
      </div>
    </div>

    <!-- Joining date -->
    <div class="field-group">
      <label class="field-label">Joining Date</label>
      <input class="field-input" type="date" [(ngModel)]="form.joiningDate"
             [disabled]="isSubmitting" />
    </div>
  </div>

  <div class="form-footer">
    <button class="btn-cancel" type="button" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
    <button class="btn-submit" type="button" (click)="onSubmit()" [disabled]="isSubmitting">
      <span *ngIf="isSubmitting" class="spinner"></span>
      {{ isEditMode ? 'Update Teacher' : 'Create Teacher' }}
    </button>
  </div>
</div>
