<div class="list-wrapper" [class.has-detail]="isSidebarOpen">

  <div class="table-pane">
    
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input class="search-input" type="text" [(ngModel)]="searchText"
               placeholder="Search subjects by name or code…" (keyup.enter)="onSearch()" />
        <button class="search-clear" *ngIf="searchText" (click)="onClearSearch()">×</button>
      </div>
      <button class="btn-search" (click)="onSearch()">Search</button>
      
      <button class="btn-add" (click)="onAddSubject()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add Subject
      </button>
    </div>

    <ng-container *ngIf="isLoading">
      <div class="skeleton-row" *ngFor="let i of [1,2,3,4]">
        <div class="sk-lines">
          <div class="sk sk-name"></div>
          <div class="sk sk-meta"></div>
        </div>
        <div class="sk sk-code"></div>
        <div class="sk sk-btn"></div>
      </div>
    </ng-container>

    <div class="empty-state" *ngIf="!isLoading && safeSubjects.length === 0">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <p class="empty-title">No subjects found</p>
      <p class="empty-sub">Get started by creating a new subject code entry.</p>
    </div>

    <table class="teacher-table" *ngIf="!isLoading && safeSubjects.length > 0">
      <thead>
        <tr>
          <th class="col-subject">Subject Details</th>
          <th class="col-code">Subject Code</th>
          <th class="col-date">Created Date</th>
          <th class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of safeSubjects; trackBy: trackById" class="table-row">
          <td class="col-subject">
            <div class="subject-cell">
              <div class="avatar-box">{{ s.name ? s.name[0].toUpperCase() : 'S' }}</div>
              <div class="subject-info">
                <span class="subject-name">{{ s.name }}</span>
              </div>
            </div>
          </td>
          <td class="col-code">
            <code class="code-chip">{{ s.code }}</code>
          </td>
          <td class="col-date">
            <span class="date-txt">{{ s.createdAt | date:'dd MMM yyyy, hh:mm a' }}</span>
          </td>
          <td class="col-actions">
            <button class="edit-btn" (click)="onEditSubject(s)" title="Edit Subject Details">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="pagination" *ngIf="totalPages > 1">
      <button class="pg-btn" [disabled]="currentPage === 0" (click)="onPageChange(currentPage - 1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button *ngFor="let p of pages" class="pg-btn" [class.active]="p === currentPage" (click)="onPageChange(p)">
        {{ p + 1 }}
      </button>
      <button class="pg-btn" [disabled]="currentPage === totalPages - 1" (click)="onPageChange(currentPage + 1)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>

<div class="detail-pane" *ngIf="isSidebarOpen">
    <div class="form-card">
      <div class="card-header">
        <h3>{{ formModel.id ? 'Modify Subject' : 'Create Subject' }}</h3>
        <button class="close-btn" (click)="onCloseSidebar()">×</button>
      </div>
      
      <form (ngSubmit)="onSubmit()" #subjectForm="ngForm" class="card-body">
        <div class="form-group">
          <label class="form-label">Subject Name <span class="required">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="formModel.subjectName" name="subjectName" 
                 placeholder="e.g. Mathematics" required #nameValid="ngModel"
                 [class.is-invalid]="nameValid.touched && !formModel.subjectName" />
        </div>

        <div class="form-group">
          <label class="form-label">Subject Code <span class="required">*</span></label>
          <input type="text" class="form-control" [(ngModel)]="formModel.subjectCode" name="subjectCode" 
                 placeholder="e.g. MATH101" required #codeValid="ngModel"
                 [class.is-invalid]="codeValid.touched && !formModel.subjectCode" />
        </div>

        <div class="action-footer">
          <button type="button" class="btn-secondary" (click)="onCloseSidebar()">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="!subjectForm.form.valid || isSaving">
            {{ isSaving ? 'Saving...' : 'Save Subject' }}
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
